name: Release

on:
  push:
    tags: ["v*"]

# contents: write → create the GitHub Release + upload the .mcpb asset.
# id-token: write → npm provenance attestation via Trusted Publishing (OIDC).
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Guards against a hand-pushed tag publishing a package.json version that doesn't match it.
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Health-check upstream APIs (gate)
        run: npm run check:api
      - run: npm run build
      - run: npm test
      - name: Pack .mcpb bundle
        run: npx mcpb pack . steam-games-mcp.mcpb
      # Use CHANGELOG.md as the single source of truth for release notes: extract
      # this version's section and feed it as the GitHub Release body.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- release notes for $VERSION -----"; cat RELEASE_NOTES.md
          # Fail loudly instead of shipping an empty GitHub Release body — this
          # exact failure happened on 2026-07-29 (v0.11.0): the tagged commit's
          # CHANGELOG.md still said "## [Unreleased]" instead of "## [$VERSION]",
          # so this awk matched nothing. sync-version.mjs now renames the heading
          # itself, but this is the safety net for whatever slips past that.
          if [ ! -s RELEASE_NOTES.md ] || ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::No CHANGELOG.md section found for '## [$VERSION]' — RELEASE_NOTES.md is empty. Check that CHANGELOG.md's heading was renamed from '## [Unreleased]'."
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: steam-games-mcp.mcpb
          body_path: RELEASE_NOTES.md
      # Idempotency guard: npm rejects re-publishing an existing version outright,
      # which would otherwise abort this job before the MCP Registry steps below
      # ever run (e.g. a tag re-run, or a version published manually as a
      # one-time bootstrap before Trusted Publishing was configured).
      - name: Check if this version is already published to npm
        id: npm_check
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "steam-games-mcp@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      # Trusted Publishing (OIDC): no token. Requires npm >= 11.5.1 and a
      # trusted publisher configured for this package on npmjs.com. Pin an
      # exact, verified-good version rather than floating `@latest` — matches
      # every other tool in this workflow being pinned to an exact commit/tag
      # (checkout/setup-node/gh-release above). npm 12.0.0 shipped a broken
      # provenance path ("Cannot find module 'sigstore'", npm/cli#9722); fixed
      # in 12.0.1 (npm/cli#9740, released 2026-07-10) — verified live via
      # `npm view npm version` that 12.0.1 is the current `latest` dist-tag.
      - name: Install npm for trusted publishing
        if: steps.npm_check.outputs.already_published != 'true'
        run: npm install -g npm@12.0.1
      - name: Publish to npm (trusted publishing + provenance)
        if: steps.npm_check.outputs.already_published != 'true'
        run: npm publish --provenance --access public

      # Publish to the official MCP Registry (registry.modelcontextprotocol.io).
      # Runs after npm publish so the npm package (with its mcpName marker) is
      # live for the registry's ownership check. The mcpb entry's fileSha256 is
      # injected from the just-packed bundle so it always matches the release
      # asset (zip mtimes make .mcpb non-reproducible, so a committed hash drifts).
      - name: Inject .mcpb SHA-256 into server.json
        run: |
          SHA=$(sha256sum steam-games-mcp.mcpb | cut -d' ' -f1)
          jq --arg sha "$SHA" \
            '(.packages[] | select(.registryType=="mcpb")).fileSha256 = $sha' \
            server.json > server.json.tmp && mv server.json.tmp server.json
          # jq's select() silently no-ops (exit 0, document unchanged) if no
          # package has registryType=="mcpb" — this would publish a stale/missing
          # fileSha256 to the MCP Registry with no error anywhere. Verify the
          # injection actually took instead of trusting jq's exit code.
          GOT="$(jq -r '.packages[] | select(.registryType=="mcpb") | .fileSha256' server.json)"
          if [ "$GOT" != "$SHA" ]; then
            echo "::error::Failed to inject fileSha256 into server.json — no package with registryType==\"mcpb\" found, or the update didn't take. Got: '$GOT', expected: '$SHA'"
            exit 1
          fi
      - name: Install mcp-publisher
        run: |
          # Pinned to an exact version + checksum rather than "latest" — this step
          # runs with live OIDC publishing credentials, so an unpinned/unverified
          # binary here would be the one weak link in an otherwise fully pinned
          # pipeline (actions pinned to commit SHAs, npm pinned to an exact
          # version above). This job only ever runs on ubuntu-latest, so the
          # linux_amd64 asset is the only one that matters. To bump: download the
          # new version's mcp-publisher_linux_amd64.tar.gz from
          # https://github.com/modelcontextprotocol/registry/releases, `sha256sum`
          # it, and update both constants below.
          MCP_PUBLISHER_VERSION="v1.8.0"
          MCP_PUBLISHER_SHA256="1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"
          curl -sL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # The registry validates the npm package by fetching this exact version,
      # and a just-published one can 404 for a few seconds: v0.15.0's first run
      # published to npm at 00:55:18 and was rejected by the registry at
      # 00:55:19 ("version '0.15.0' was not found"). Wait for npm to serve it
      # (up to 2 min) before logging in, so the short-lived token isn't spent
      # waiting. Also a no-op wait on a re-run where npm publish was skipped.
      - name: Wait for the npm version to be visible
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          for i in $(seq 1 24); do
            if npm view "steam-games-mcp@${PKG_VERSION}" version >/dev/null 2>&1; then
              echo "steam-games-mcp@${PKG_VERSION} is visible on npm"
              exit 0
            fi
            echo "waiting for steam-games-mcp@${PKG_VERSION} on npm (${i}/24)…"
            sleep 5
          done
          echo "::error::steam-games-mcp@${PKG_VERSION} still not visible on npm after 2 minutes; the MCP Registry would reject it. Re-run this job once it appears."
          exit 1
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
