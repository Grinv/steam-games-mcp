name: Release

on:
  push:
    tags: ["v*"]

# contents: write → create the GitHub Release + upload the .mcpb asset.
# id-token: write → npm provenance attestation via Trusted Publishing (OIDC).
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Health-check upstream APIs (gate)
        run: npm run check:api
      - run: npm run build
      - run: npm test
      - name: Pack .mcpb bundle
        run: npx mcpb pack . steam-games-mcp.mcpb
      # Use CHANGELOG.md as the single source of truth for release notes: extract
      # this version's section and feed it as the GitHub Release body.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- release notes for $VERSION -----"; cat RELEASE_NOTES.md
          # Fail loudly instead of shipping an empty GitHub Release body — this
          # exact failure happened on 2026-07-29 (v0.11.0): the tagged commit's
          # CHANGELOG.md still said "## [Unreleased]" instead of "## [$VERSION]",
          # so this awk matched nothing. sync-version.mjs now renames the heading
          # itself, but this is the safety net for whatever slips past that.
          if [ ! -s RELEASE_NOTES.md ] || ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::No CHANGELOG.md section found for '## [$VERSION]' — RELEASE_NOTES.md is empty. Check that CHANGELOG.md's heading was renamed from '## [Unreleased]'."
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: steam-games-mcp.mcpb
          body_path: RELEASE_NOTES.md
      # Idempotency guard: npm rejects re-publishing an existing version outright,
      # which would otherwise abort this job before the MCP Registry steps below
      # ever run (e.g. a tag re-run, or a version published manually as a
      # one-time bootstrap before Trusted Publishing was configured).
      - name: Check if this version is already published to npm
        id: npm_check
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "steam-games-mcp@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      # Trusted Publishing (OIDC): no token. Requires npm >= 11.5.1 and a
      # trusted publisher configured for this package on npmjs.com. Pin an
      # exact, verified-good version rather than floating `@latest` — matches
      # every other tool in this workflow being pinned to an exact commit/tag
      # (checkout/setup-node/gh-release above). npm 12.0.0 shipped a broken
      # provenance path ("Cannot find module 'sigstore'", npm/cli#9722); fixed
      # in 12.0.1 (npm/cli#9740, released 2026-07-10) — verified live via
      # `npm view npm version` that 12.0.1 is the current `latest` dist-tag.
      - name: Install npm for trusted publishing
        run: npm install -g npm@12.0.1
      - name: Publish to npm (trusted publishing + provenance)
        if: steps.npm_check.outputs.already_published != 'true'
        run: npm publish --provenance --access public

      # Publish to the official MCP Registry (registry.modelcontextprotocol.io).
      # Runs after npm publish so the npm package (with its mcpName marker) is
      # live for the registry's ownership check. The mcpb entry's fileSha256 is
      # injected from the just-packed bundle so it always matches the release
      # asset (zip mtimes make .mcpb non-reproducible, so a committed hash drifts).
      - name: Inject .mcpb SHA-256 into server.json
        run: |
          SHA=$(sha256sum steam-games-mcp.mcpb | cut -d' ' -f1)
          jq --arg sha "$SHA" \
            '(.packages[] | select(.registryType=="mcpb")).fileSha256 = $sha' \
            server.json > server.json.tmp && mv server.json.tmp server.json
          # jq's select() silently no-ops (exit 0, document unchanged) if no
          # package has registryType=="mcpb" — this would publish a stale/missing
          # fileSha256 to the MCP Registry with no error anywhere. Verify the
          # injection actually took instead of trusting jq's exit code.
          GOT="$(jq -r '.packages[] | select(.registryType=="mcpb") | .fileSha256' server.json)"
          if [ "$GOT" != "$SHA" ]; then
            echo "::error::Failed to inject fileSha256 into server.json — no package with registryType==\"mcpb\" found, or the update didn't take. Got: '$GOT', expected: '$SHA'"
            exit 1
          fi
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
