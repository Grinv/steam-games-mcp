<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- steam-games-mcp icon — original vector source. Colors measured live
       from Steam's own site/assets, not guessed:
         #67c1f5 — getComputedStyle background-color sampled on
           store.steampowered.com (Steam's familiar light-blue accent, close
           to the commonly-cited "Steam blue" #66c0f4).
         #071937 — most frequent non-transparent pixel color in
           store.steampowered.com/favicon.ico (Steam's own logo-mark ink), a
           dark blue-black consistent with the site's body background
           (measured #0f1923).
       Shape is a literal (but simplified/original) gamepad silhouette — a
       rounded capsule body with a D-pad cross on the left and two action
       buttons on the right — not Steam's own logo mark; color association
       only. Corners are natively rounded (rx = height/2 on the body,
       rounded-rect joins on the D-pad arms), no linejoin trick needed.
       See generate-icon.py in this same directory for how this was actually
       rasterized to assets/icon.png (a plain SVG->PNG render loses the
       transparent background in both a Chrome screenshot and macOS Quick
       Look's SVG thumbnailer — both silently composite against opaque
       white regardless of this file's own lack of a background rect). -->
  <rect x="56" y="176" width="400" height="160" rx="80" fill="#67c1f5"/>
  <rect x="111" y="233" width="110" height="46" rx="14" fill="#071937"/>
  <rect x="143" y="201" width="46" height="110" rx="14" fill="#071937"/>
  <circle cx="360" cy="224" r="30" fill="#071937"/>
  <circle cx="400" cy="276" r="30" fill="#071937"/>
</svg>
