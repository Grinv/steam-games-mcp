<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- steam-games-mcp icon — original vector source.
       Gradient stops are Valve's own real Steam logo gradient, pulled
       directly from their official SVG asset
       (upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg,
       the <linearGradient id="A"> behind their "eye" mark), not
       approximated from a page-background sample. The foreground (D-pad +
       buttons) is plain white, matching how the real logo puts a solid
       white mark over that same gradient.
       Shape is a literal (but simplified/original) gamepad silhouette — a
       rounded, near-square body with a D-pad cross on the left and two
       action buttons on the right — not Steam's own logo mark (their
       actual "eye" glyph); color/gradient association only.
       See generate-icon.py in this same directory for how this was actually
       rasterized to assets/icon.png (a plain SVG->PNG render loses the
       transparent background in both a Chrome screenshot and macOS Quick
       Look's SVG thumbnailer — both silently composite against opaque
       white regardless of this file's own lack of a background rect). -->
  <defs>
    <linearGradient id="steamGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111d2e"/>
      <stop offset="0.212" stop-color="#051839"/>
      <stop offset="0.407" stop-color="#0a1b48"/>
      <stop offset="0.581" stop-color="#132e62"/>
      <stop offset="0.738" stop-color="#144b7e"/>
      <stop offset="0.873" stop-color="#136497"/>
      <stop offset="1" stop-color="#1387b8"/>
    </linearGradient>
  </defs>
  <rect x="66" y="126" width="380" height="260" rx="130" fill="url(#steamGradient)"/>
  <rect x="122" y="232" width="116" height="48" rx="14" fill="#ffffff"/>
  <rect x="156" y="198" width="48" height="116" rx="14" fill="#ffffff"/>
  <circle cx="332" cy="220" r="32" fill="#ffffff"/>
  <circle cx="376" cy="286" r="32" fill="#ffffff"/>
</svg>
